# Copy to profile/recruiter-preferences.yaml and edit. profile/ is git-ignored, keep it private.
candidate_name: "Your Name"
resume_file: profile/resume.md
report_email: you@example.com           # reports go to this address only, never to recruiters
email_mode: draft                       # draft = Gmail draft you review, send = email it to report_email

search:
  target_roles:                         # C-level roles you want to be considered for
    - "Chief Technology Officer"
    - "Chief Operating Officer"
    - "Chief Product Officer"
  industries: ["SaaS", "fintech", "healthtech"]
  company_stage: ["growth", "PE-backed", "public"]   # optional filter
  regions: ["Philippines", "APAC", "Remote"]
  work_modes: ["remote", "hybrid"]
  min_total_comp: null                  # optional, in currency below
  currency: USD

exclude_firms: []                       # e.g. your current employer's retained firm
exclude_words:                          # skip recruiters whose profile contains these
  - "all levels"
  - "volume hiring"
  - "staffing"

scoring:
  min_fit_score: 6                      # out of 10, below this are listed but get no drafts
  max_drafts_per_run: 3                 # full outreach pack for at most this many recruiters

confidentiality: "Quiet search. Do not name my current employer in outreach."
schedule_note: "Run weekly, Monday 07:00 Manila time via a scheduled task."
