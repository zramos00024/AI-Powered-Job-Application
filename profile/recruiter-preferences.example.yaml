# Copy to profile/recruiter-preferences.yaml and edit. profile/ is git-ignored, keep it private.
candidate_name: "Candidate Name"        # may be a friend you are helping
resume_file: profile/resume.md          # that person's master resume
report_email: you@example.com           # reports go to this address only, never to recruiters
email_mode: draft                       # draft = Gmail draft you review, send = email it to report_email

search:
  levels: ["C-level", "VP", "Head of"]  # seniority the recruiter must place
  target_roles:
    - "Chief Operating Officer"
    - "VP Operations"
    - "Head of Operations"
  industries: ["SaaS", "fintech"]
  company_stage: ["growth", "PE-backed", "public"]
  target_companies: []                  # optional, for in-house executive recruiters
  regions: ["Philippines", "APAC", "Remote"]
  work_modes: ["remote", "hybrid"]
  open_to_interim: false                # true adds interim and fractional executive firms
  signal_window_days: 30                # how far back to look for departures, funding, acquisitions
  min_total_comp: null
  currency: USD

exclude_firms: []                       # e.g. the firm that ran the process that fell through
exclude_words: ["all levels", "volume hiring", "staffing"]

scoring:
  min_fit_score: 6                      # out of 10
  max_drafts_per_run: 5                 # full outreach packs per run

confidentiality: "Quiet search. Do not name the current employer in outreach."
schedule_note: "Run Monday and Thursday 07:00 Manila time via a scheduled task."
